<!DOCTYPE html>
<html>
<head>
<title>Jason Morris - Videos</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>
body,h1 {
  font-family: "Times New Roman", Times, serif;
}

.video-gallery {
  display: flex;
  overflow-x: auto;
  gap: 20px;
  padding: 20px;
  scroll-behavior: smooth;
}

.video-gallery video {
  width: 350px;
  height: auto;
  border-radius: 8px;
  background-color: #000;
}

.video-gallery::-webkit-scrollbar {
  display: none;
}

.video-gallery {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
</style>
</head>

<body>

<!-- Sidebar -->
<nav class="w3-sidebar w3-black w3-animate-top w3-xxlarge" 
     style="display:none;padding-top:150px" id="mySidebar">

  <a href="javascript:void(0)" onclick="w3_close()" 
     class="w3-button w3-black w3-xxlarge w3-padding w3-display-topright">
    <i class="fa fa-remove"></i>
  </a>

  <div class="w3-bar-block w3-center">
    <a href="bio.html" class="w3-bar-item w3-button w3-text-grey w3-hover-black">Bio</a>
    <a href="photos.html" class="w3-bar-item w3-button w3-text-grey w3-hover-black">Photos</a>
    <a href="videos.html" class="w3-bar-item w3-button w3-text-grey w3-hover-black">Videos</a>
    <a href="contact.html" class="w3-bar-item w3-button w3-text-grey w3-hover-black">Contact</a>
  </div>

</nav>

<!-- Top Navbar -->
<div class="w3-bar w3-white w3-padding w3-card"
     style="position:sticky; top:0; z-index:1000;">

  <img src="Photos/JasonMorris.PNG"
       style="height:50px; width:auto;"
       class="w3-bar-item">

  <span class="w3-bar-item w3-right w3-xxlarge" onclick="w3_open()">
    <i class="fa fa-bars"></i>
  </span>

</div>

<!-- Page Content -->
<div class="w3-content" style="max-width:1500px">

<br>
<br>

<!-- Header -->
<header class="w3-center w3-margin-bottom">
  <img src="Photos/videos.png" style="width:30%">
</header>

<!-- Video Gallery -->
<div class="video-gallery">

  <video controls>
    <source src="Videos/video1.MP4" type="video/mp4">
    Your browser does not support the video tag.
  </video>


  <video controls>
    <source src="Videos/video3.MOV" type="video/mov">
    Your browser does not support the video tag.
  </video>

  <video controls>
    <source src="Videos/video4.MP4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

</div>

</div>

<!-- Footer -->
<footer class="w3-container w3-padding-64 w3-light-grey w3-center w3-opacity w3-xlarge" style="margin-top:128px"> 

</footer>

<script>

// Open sidebar
function w3_open() {
  document.getElementById("mySidebar").style.width = "100%";
  document.getElementById("mySidebar").style.display = "block";
}

// Close sidebar
function w3_close() {
  document.getElementById("mySidebar").style.display = "none";
}

</script>

</body>
</html>
