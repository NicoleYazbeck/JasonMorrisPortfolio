<!DOCTYPE html>
<html>
<head>
<title>Jason Morris - Videos</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>
body,h1 {
  font-family: "Times New Roman", Times, serif;
}

.video-gallery {
  display: flex;
  overflow-x: auto;
  gap: 20px;
  padding: 20px;
  scroll-behavior: smooth;
}

.video-gallery video {
  width: 350px;
  height: auto;
  border-radius: 8px;
  background-color: #000;
}

.video-gallery::-webkit-scrollbar {
  display: none;
}

.video-gallery {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
   /* Sidebar */
 #mySidebar {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 9999;
    padding-top: 120px;
  }
  .sidebar-close {
    position: absolute;
    top: 20px; right: 28px;
    font-size: 2rem;
    color: #888;
    cursor: pointer;
    background: none;
    border: none;
  }
  .sidebar-close:hover { color: #fff; }
  .nav-links { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .nav-links a {
    font-family: "Montserrat", sans-serif;
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #666;
    text-decoration: none;
    padding: 10px 40px;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: #fff; }

  /* Top Bar */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: white;
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .topbar img { height: 36px; width: auto; opacity: 0.85; }
  .menu-btn {
    background: none;
    border: none;
    color: rgba(10, 10, 10, 0.45);
    font-size: 1.4rem;
    cursor: pointer;
    padding: 8px;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .menu-btn:hover { opacity: 1; }

</style>
</head>

<body>

<!-- Sidebar -->
<nav id="mySidebar">
  <button class="sidebar-close" onclick="w3_close()"><i class="fa fa-times"></i></button>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="bio.html">Bio</a>
    <a href="photos.html">Photos</a>
    <a href="videos.html">Videos</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<!-- Top Bar -->
<div class="topbar">
  <img src="Photos/JasonMorris.PNG" alt="Jason Morris Jr.">
  <p class="navbar_details">Visual Artist | Photographer</p>
  <button class="menu-btn" onclick="w3_open()"><i class="fa fa-bars"></i></button>
</div>
  
<!-- Page Content -->
<div class="w3-content" style="max-width:1500px">

<br>
<br>

<!-- Header -->
<header class="w3-center w3-margin-bottom">
  <img src="Photos/videos.png" style="width:30%">
</header>

<!-- Video Gallery -->
<div class="video-gallery">

  <video controls>
    <source src="Videos/video1.MP4" type="video/mp4">
    Your browser does not support the video tag.
  </video>


  <video controls>
    <source src="Videos/video3.MOV" type="video/quicktime">
    Your browser does not support the video tag.
  </video>

  <video controls>
    <source src="Videos/video4.MP4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

</div>

</div>

<!-- Footer -->
<footer class="w3-container w3-padding-64 w3-light-grey w3-center w3-opacity w3-xlarge" style="margin-top:128px"> 

</footer>

<script>

// Open sidebar
function w3_open() {
  document.getElementById("mySidebar").style.width = "100%";
  document.getElementById("mySidebar").style.display = "block";
}

// Close sidebar
function w3_close() {
  document.getElementById("mySidebar").style.display = "none";
}

</script>

</body>
</html>
